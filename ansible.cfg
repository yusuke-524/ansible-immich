[defaults]
# Ansible 設定ファイル

# インベントリファイルのパス
inventory = ./inventories/hosts.ini

# リモートユーザー
remote_user = immich

# パイプラインの有効化（パフォーマンス向上）
pipelining = True

# 接続タイムアウト
timeout = 30

# ホスト鍵チェック（初回実行時に yes に変更推奨）
host_key_checking = False

# ロールパス
roles_path = ./roles

# 差分表示の有効化
diff = False

# ログの有効化
log_path = ./ansible.log

# Vault ID ファイル
vault_identity_list = default@.vault_pass

[privilege_escalation]
# sudo を使用して権限昇格
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH コネクション設定
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = %(directory)s/%%h-%%r-%%p
