# グループ変数 - Immich サーバー用
# 環境に応じてカスタマイズしてください

# ユーザー情報
immich_user: immich
immich_group: www-data

# ホスト名
immich_vm_hostname: immich-ansible-test

# ネットワーク設定
immich_ip: 10.0.20.100
immich_subnet: 10.0.20.0/24
immich_gateway: 10.0.20.1
immich_dns: 10.0.20.1

# NFS マウント設定
nfs_server: 10.0.20.10
nfs_export_path: /mnt/pool4tb1/test/test_nfs

# Immich 設定
immich_server_url: http://10.0.20.100

# APT キャッシュサーバー
apt_cache_server: apt.int.sirosuzu.net
apt_cache_port: 3142

# タイムゾーン
timezone: Asia/Tokyo
